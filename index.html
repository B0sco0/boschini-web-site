<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sito in Lavorazione - Work in Progress</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-container {
            font-size: 64px;
            color: #ffc107;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.1rem;
            color: #e0e0e0;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .progress-bar {
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            height: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            width: 65%; /* Modifica la percentuale a seconda dello stato dei lavori */
            height: 100%;
            background: #ffc107;
            border-radius: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .social-icons a {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 50%;
            text-decoration: none;
            transition: background 0.3s, transform 0.3s;
        }

        .social-icons a:hover {
            background: #ffc107;
            color: #1e3c72;
            transform: translateY(-3px);
        }

        .footer-note {
            margin-top: 35px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Responsive per smartphone */
        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            p { font-size: 1rem; }
            .container { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Icona ingranaggio in movimento -->
        <div class="icon-container">
            <i class="fa-solid fa-gears"></i>
        </div>

        <h1>Sito in Costruzione</h1>
        <p>Stiamo lavorando duramente per portarti qualcosa di eccezionale. Il nostro nuovo sito web sarà online molto presto. Torna a trovarci!</p>

        <!-- Barra di avanzamento stimata -->
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <!-- Se vuoi aggiungere i tuoi link social (sostituisci il # con i tuoi link) -->
        <div class="social-icons">
            <a href="#" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" title="Twitter / X"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="mailto:tua-email@tuodominio.it" title="Contattaci via Email"><i class="fa-solid fa-envelope"></i></a>
        </div>

        <div class="footer-note">
            &copy; 2026 - Powered by Altervista
        </div>
    </div>

</body>
</html>
